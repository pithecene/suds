[tools]
# Task check runs rustfmt and Clippy, which a minimal toolchain lacks.
rust = { version = "1.98.1", components = "rustfmt,clippy" }
"aqua:go-task/task" = "3.48.0"
"aqua:google/yamlfmt" = "0.21.0"
# The desktop application's frontend and the Tauri command-line tool.
node = "24.21.0"
pnpm = "12.15.0"
# Bosun registers each worktree of this repository with Suds (bosun.yaml), through this release.
"github:pithecene/suds" = { version = "0.1.0", os = ["linux", "macos"] }
