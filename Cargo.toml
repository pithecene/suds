[package]
name = "suds"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
description = "Local-first maintenance and reconciliation utility for developer workstations"
repository = "https://github.com/pithecene/suds"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# A bind mount keeps its device, so only statx's mount-root attribute marks it.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
