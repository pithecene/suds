[workspace]
resolver = "3"
members = ["crates/suds-core", "crates/suds-view", "apps/cli", "apps/webview/src-tauri", "apps/desktop"]
# The desktop crate needs the frontend's build output and, on Linux, the
# WebKitGTK libraries. The window needs a display's libraries. A plain cargo
# command therefore builds the core, the view model, and the CLI.
default-members = ["crates/suds-core", "crates/suds-view", "apps/cli"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
repository = "https://github.com/pithecene/suds"

[workspace.dependencies]
suds-core = { path = "crates/suds-core" }
suds-view = { path = "crates/suds-view" }
clap = { version = "=4.6.8", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.6", features = ["fs", "process"] }
tempfile = "=3.27.0"
jiff = "=0.2.43"
tauri = "=2.12.5"
slint = "=1.19.0"
slint-build = "=1.19.0"
i-slint-backend-testing = "=1.19.0"
tauri-build = "=2.7.6"
tauri-plugin-dialog = "=2.8.4"

[workspace.lints.rust]
unsafe_code = "forbid"
