[package]
name = "suds-core"
description = "The workstation model and filesystem inspection that the Suds interfaces share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
# The operation journal stores one JSON record per line.
serde_json.workspace = true
# A move opens each directory without following a link and renames an entry
# with the kernel's no-replace flag, which the standard library lacks. On
# Linux, statx's mount-root attribute also marks a bind mount, which keeps its
# device.
rustix.workspace = true

# APFS names a file's clones through getattrlist, which rustix lacks.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bench]]
name = "suite"
path = "benches/suite.rs"
harness = false

[lints]
workspace = true
