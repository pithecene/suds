version: "3"

tasks:
  default:
    desc: List repository commands
    cmd: task --list

  build:
    desc: Build the release binary of the suds command
    cmd: cargo build --locked --release

  test:
    desc: Run the core's and the command line's unit and command-line tests
    cmd: cargo test --locked

  lint:
    desc: Check Rust formatting, Clippy lints, and YAML formatting without modifying files
    cmds:
      - cargo fmt --all --check
      - cargo clippy --locked --all-targets -- -D warnings
      - yamlfmt -lint .

  format:
    desc: Format the Rust sources and YAML files
    aliases: [fmt]
    cmds:
      - cargo fmt --all
      - yamlfmt .

  check:
    desc: Build, test, and lint the core and the command line
    cmds:
      - task: build
      - task: test
      - task: lint

  inspect:
    desc: Run the debug build of suds inspect with the arguments after --
    cmd: cargo run --locked --quiet -p suds -- inspect {{.CLI_ARGS}}

  window:
    desc: Run the native window on this workstation's development storage
    cmd: cargo run --locked --release -p suds-window

  window:install:
    desc: Install the native window, its desktop entry, and its icon for this user
    cmds:
      - cargo build --locked --release -p suds-window
      - install -D -m 755 target/release/suds-window "{{.HOME}}/.local/bin/suds-window"
      - install -D -m 644 apps/window/assets/suds.desktop "{{.HOME}}/.local/share/applications/suds.desktop"
      - install -D -m 644 apps/window/assets/suds.svg "{{.HOME}}/.local/share/icons/hicolor/scalable/apps/suds.svg"

  window:check:
    desc: Build, test, and lint the native window and its view model
    cmds:
      - cargo build --locked -p suds-window
      - cargo test --locked -p suds-window -p suds-view
      - cargo clippy --locked -p suds-window -p suds-view --all-targets -- -D warnings

  desktop:install:
    desc: Install the desktop frontend's pinned packages
    dir: apps/desktop
    cmd: pnpm install --frozen-lockfile

  desktop:
    desc: Run the desktop application in development mode
    dir: apps/desktop
    deps: ['desktop:install']
    cmd: pnpm tauri dev

  desktop:check:
    desc: Build the desktop frontend, then test and lint the desktop crate
    deps: ['desktop:install']
    cmds:
      # The desktop crate embeds the frontend's build output, so the build comes first.
      - pnpm --dir apps/desktop build
      - cargo test --locked -p suds-desktop
      - cargo clippy --locked -p suds-desktop --all-targets -- -D warnings
