rust = { version = "1.98.1", components = "rustfmt,clippy" }
"aqua:go-task/task" = "3.48.0"
"aqua:google/yamlfmt" = "0.21.0"
# The desktop application's frontend and the Tauri command-line tool.
node = "24.21.0"
pnpm = "12.15.0"
