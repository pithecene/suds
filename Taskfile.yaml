version: "3"

tasks:
  default:
    desc: List repository commands
    cmd: task --list

  build:
    desc: Build the release binary of the suds command
    cmd: cargo build --locked --release

  test:
    desc: Run the core's and the command line's unit and command-line tests
    cmd: cargo test --locked

  lint:
    desc: Check Rust formatting, Clippy lints, and YAML formatting without modifying files
    cmds:
      - cargo fmt --all --check
      - cargo clippy --locked --all-targets -- -D warnings
      - yamlfmt -lint .

  format:
    desc: Format the Rust sources and YAML files
    aliases: [fmt]
    cmds:
      - cargo fmt --all
      - yamlfmt .

  check:
    desc: Build, test, and lint the core and the command line
    cmds:
      - task: build
      - task: test
      - task: lint

  inspect:
    desc: Run the debug build of suds inspect with the arguments after --
    cmd: cargo run --locked --quiet -p suds -- inspect {{.CLI_ARGS}}

  desktop:
    desc: Run the desktop application on this workstation's development storage
    cmd: cargo run --locked --release -p suds-desktop

  desktop:install:
    desc: Install the desktop application, its desktop entry, and its icon for this user
    cmds:
      - cargo build --locked --release -p suds-desktop
      - sh apps/desktop/install.sh target/release/suds-desktop

  desktop:check:
    desc: Build, test, and lint the desktop application and its view model
    cmds:
      - cargo build --locked -p suds-desktop
      - cargo test --locked -p suds-desktop -p suds-view
      - cargo clippy --locked -p suds-desktop -p suds-view --all-targets -- -D warnings
