[workspace]
resolver = "3"
members = ["crates/suds-build", "crates/suds-core", "crates/suds-view", "apps/cli", "apps/desktop"]
# The desktop application needs a display's libraries. A plain cargo command
# therefore builds the core, the view model, and the CLI.
default-members = ["crates/suds-build", "crates/suds-core", "crates/suds-view", "apps/cli"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
repository = "https://github.com/pithecene/suds"

[workspace.dependencies]
suds-build = { path = "crates/suds-build" }
suds-core = { path = "crates/suds-core" }
suds-view = { path = "crates/suds-view" }
clap = { version = "=4.6.8", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.6", features = ["fs", "process"] }
tempfile = "=3.27.0"
jiff = "=1.0.1"
slint = "=1.19.0"
slint-build = "=1.19.0"
i-slint-backend-testing = "=1.19.0"

[workspace.lints.rust]
unsafe_code = "forbid"
