[package]
name = "suds-desktop"
description = "The Suds desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "suds-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
suds-core.workspace = true
serde.workspace = true
tauri.workspace = true
# The folder picker runs in Rust, so the webview never receives a path that
# it could pass back as a file's identity.
tauri-plugin-dialog.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# The mock runtime checks the capability file against each command.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
